name: kit-docs-drift

# claude-kit: weekly list of units whose code moved on since their pack was last mapped (or that have no
# pack), kept in one GitHub issue. Units come from .ai/kit/manifest.json. No AI involved.

on:
  schedule:
    - cron: "{{DRIFT_CRON}}"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find stale or missing packs
        id: scan
        run: |
          report=$(python3 - <<'PY'
          import json, re, subprocess, pathlib
          m = json.loads(pathlib.Path(".ai/kit/manifest.json").read_text())
          out = []
          for u in m.get("units", []):
              p = u["path"]; y = pathlib.Path(p, ".ai", "unit.yaml")
              if not y.exists(): y = pathlib.Path(p, ".ai", "solution.yaml")
              if not y.exists():
                  out.append(f"- `{p}`: **no knowledge pack** - run the {m['prefix']}-map-unit skill"); continue
              last = (re.search(r"(?m)^last_mapped_commit:\s*(\S+)", y.read_text()) or [None, ""])[1]
              ok = subprocess.run(["git", "cat-file", "-e", f"{last}^{{commit}}"], capture_output=True).returncode == 0 if last else False
              if not ok:
                  out.append(f"- `{p}`: last_mapped_commit not set - run {m['prefix']}-docs-refresh"); continue
              n = int(subprocess.run(["git", "rev-list", "--count", f"{last}..HEAD", "--", p, f":!{p}/.ai"], capture_output=True, text=True).stdout.strip() or 0)
              if n > 20:
                  out.append(f"- `{p}`: {n} commits since {last} - run {m['prefix']}-docs-refresh")
          print("\n".join(out))
          PY
          )
          { echo "report<<EOF"; printf "%s" "$report"; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Update tracking issue
        if: steps.scan.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          [ -z "$(echo "$REPORT" | tr -d '[:space:]')" ] && exit 0
          title="Knowledge packs needing a refresh"
          body=$(printf "Generated by kit-docs-drift on %s.\n\n%s" "$(date -u +%F)" "$REPORT")
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
